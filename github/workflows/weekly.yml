name: Weekly refresh
on:
  schedule:
    - cron: "0 5 * * 1"   # Monday 05:00 UTC = 06:00 West Africa Time
  workflow_dispatch: {}   # lets you run it by hand from the Actions tab
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check sources
        run: python scripts/refresh.py
      - name: Commit results
        if: always()
        run: |
          git config user.name "job-board-bot"
          git config user.email "job-board-bot@users.noreply.github.com"
          git add data reports
          git diff --cached --quiet || git commit -m "Weekly refresh $(date -u +%F)"
          git push
