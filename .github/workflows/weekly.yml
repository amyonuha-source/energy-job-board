name: Weekly refresh
on:
  schedule:
    - cron: "0 5 * * 1"   # Monday 05:00 UTC = 06:00 West Africa Time
  workflow_dispatch: {}   # lets you run it by hand from the Actions tab
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Locate project files
        id: loc
        run: |
          echo "Files at the top of the repository:"; ls -la
          SCRIPT=$(find . -path ./.git -prune -o -path "*scripts/refresh.py" -print | head -1)
          if [ -z "$SCRIPT" ]; then
            echo "::error::scripts/refresh.py is not in the repository. Upload the scripts folder (see README step 2b)."
            exit 1
          fi
          DIR=$(dirname "$(dirname "$SCRIPT")")
          echo "Project folder: $DIR"
          if [ ! -f "$DIR/sources.json" ]; then
            echo "::error::sources.json is missing from $DIR. Upload it next to the scripts folder."
            exit 1
          fi
          mkdir -p "$DIR/data" "$DIR/reports"
          [ -s "$DIR/data/state.json" ] || echo '{}' > "$DIR/data/state.json"
          [ -s "$DIR/data/log.json" ] || echo '[]' > "$DIR/data/log.json"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
      - name: Check sources
        working-directory: ${{ steps.loc.outputs.dir }}
        run: python scripts/refresh.py
      - name: Commit results
        if: always() && steps.loc.outputs.dir != ''
        working-directory: ${{ steps.loc.outputs.dir }}
        run: |
          git config user.name "job-board-bot"
          git config user.email "job-board-bot@users.noreply.github.com"
          git add -A data reports
          git diff --cached --quiet || git commit -m "Weekly refresh $(date -u +%F)"
          git push
